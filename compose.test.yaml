services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rapi_test
      POSTGRES_USER: rapi
      POSTGRES_PASSWORD: rapi-local-only
    ports: ["127.0.0.1::5432"]
    volumes: ["/var/lib/postgresql/data"]
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U rapi -d rapi_test"]
      interval: 1s
      timeout: 3s
      retries: 30
