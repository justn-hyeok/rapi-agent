services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rapi
      POSTGRES_USER: rapi
      POSTGRES_PASSWORD: rapi-local-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - rapi-postgres:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U rapi -d rapi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rapi-postgres:
